name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  LUCIDA_TESTDATA: ${{ github.workspace }}/testdata
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      # ANDROID_HOME is preinstalled on ubuntu-latest, so the Android library modules are included.
      - run: ./gradlew --no-daemon --console=plain :lucida-core:test :lucida-openfeature:test :lucida-android:compileDebugKotlin :lucida-compose:compileDebugKotlin
